<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zona 04 — Apocalyptic Room</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080907;color:#ddd;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#10130f}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,4,3,.92);cursor:pointer;z-index:5}
#panel{width:min(520px,90vw);padding:30px;border:1px solid #5b6254;background:#0b0d0b;box-shadow:0 20px 80px #000}
h1{margin:0 0 8px;letter-spacing:.08em}p{color:#aeb3a4}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border:1px solid #a7ad99;letter-spacing:.08em}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}.cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2px;border-radius:50%;background:#eee;box-shadow:0 0 7px #fff}
#info{position:absolute;left:20px;bottom:20px;padding:12px 15px;background:rgba(5,7,5,.7);border:1px solid #555;font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="cross"></div><div id="info">WASD mover · SHIFT correr · mouse mirar</div></div>
<div id="start"><div id="panel"><h1>ZONA 04</h1><p>Un cuarto abandonado después del colapso.</p><p>No hay enemigos. Explora y observa lo que quedó atrás.</p><div class="btn">HAZ CLIC PARA ENTRAR</div></div></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),start=document.getElementById('start');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const player={x:0,z:8.2,a:0,pitch:0,active:false};
const keys={};
const walls=[
{x1:-15,z1:-11,x2:15,z2:-11},{x1:15,z1:-11,x2:15,z2:11},
{x1:15,z1:11,x2:-15,z2:11},{x1:-15,z1:11,x2:-15,z2:-11},
{x1:8.45,z1:10.48,x2:8.45,z2:11},{x1:11.55,z1:11,x2:11.55,z2:10.48}
];
const objects=[
{x:-9,z:-6.8,w:4.8,d:1.0,h:3.8,c:'#30332f',name:'estantería'},
{x:7,z:-5.5,w:6,d:1.7,h:1.4,c:'#493a2d',name:'mesa de trabajo'},
{x:-1,z:-3.5,w:3.5,d:1.8,h:1.5,c:'#3f3429',name:'mesa'},
{x:3.3,z:-1.8,w:1.3,d:1.1,h:1.0,c:'#34362f',name:'silla caída'},
{x:-11,z:3,w:1.2,d:1.0,h:.8,c:'#57372a',name:'caja'},
{x:-9.6,z:4,w:1.0,d:1.0,h:.7,c:'#3b3329',name:'caja'},
{x:5,z:2,w:1.0,d:1.0,h:.7,c:'#4b3a2d',name:'escombro'},
{x:8,z:4,w:1.3,d:1.1,h:.9,c:'#3b3028',name:'escombro'}
];

function collide(x,z){
 const r=.38;
 if(x<-14.5||x>14.5||z<-10.5||z>10.5)return true;
 for(const o of objects)if(Math.abs(x-o.x)<o.w/2+r&&Math.abs(z-o.z)<o.d/2+r)return true;
 return false;
}
function startGame(){player.active=true;start.classList.add('hidden');canvas.focus();try{canvas.requestPointerLock()}catch(e){}}
start.addEventListener('click',startGame);
document.addEventListener('pointerlockchange',()=>{});
addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(!player.active&&(e.code==='Enter'||e.code==='Space'))startGame()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('mousemove',e=>{if(!player.active)return;player.a-=e.movementX*.0025;player.pitch=Math.max(-.5,Math.min(.5,player.pitch-e.movementY*.0018))});

function move(dt){
 if(!player.active)return;
 const speed=(keys.ShiftLeft||keys.ShiftRight)?6:3.5;
 let f=Number(keys.KeyW||keys.ArrowUp)-Number(keys.KeyS||keys.ArrowDown);
 let s=Number(keys.KeyD||keys.ArrowRight)-Number(keys.KeyA||keys.ArrowLeft);
 const n=Math.hypot(f,s)||1;f/=n;s/=n;
 const nx=player.x+(-Math.sin(player.a)*f+Math.cos(player.a)*s)*speed*dt;
 const nz=player.z+(-Math.cos(player.a)*f-Math.sin(player.a)*s)*speed*dt;
 if(!collide(nx,player.z))player.x=nx;if(!collide(player.x,nz))player.z=nz;
}
function rayAngle(a){while(a<-Math.PI)a+=Math.PI*2;while(a>Math.PI)a-=Math.PI*2;return a}
function wallDist(ang){
 let best=100;
 const rx=Math.sin(ang),rz=Math.cos(ang);
 for(const w of walls){
  const dx=w.x2-w.x1,dz=w.z2-w.z1;
  const den=rx*dz-rz*dx;if(Math.abs(den)<1e-6)continue;
  const t=((w.x1-player.x)*dz-(w.z1-player.z)*dx)/den;
  const u=((w.x1-player.x)*rz-(w.z1-player.z)*rx)/den;
  if(t>0&&u>=0&&u<=1)best=Math.min(best,t);
 }
 return best;
}
function render(){
 ctx.clearRect(0,0,W,H);
 const horizon=H/2+player.pitch*H*.45;
 ctx.fillStyle='#171b15';ctx.fillRect(0,0,W,horizon);
 ctx.fillStyle='#292b26';ctx.fillRect(0,horizon,W,H-horizon);
 // ceiling/floor bands
 const fov=Math.PI/3;
 const rays=Math.max(160,Math.floor(W/3));
 const colW=W/rays;
 for(let i=0;i<rays;i++){
  const cam=(i/(rays-1)-.5)*fov,ang=player.a+cam;
  let d=wallDist(ang)*Math.cos(cam);
  const oh=objectsHit(ang,cam);
  if(oh<d)d=oh;
  const wallH=Math.min(H*2.2,430/d);
  const y=horizon-wallH/2;
  const shade=Math.max(18,105-d*4);
  ctx.fillStyle='rgb('+shade+','+(shade+3)+','+(shade-2)+')';
  ctx.fillRect(i*colW,y,colW+1,wallH);
 }
 drawObjects(horizon,fov);
 // windows glow
 ctx.globalAlpha=.18;ctx.fillStyle='#aab9a5';ctx.fillRect(W*.29, H*.18, W*.16,H*.2);ctx.fillRect(W*.56,H*.18,W*.12,H*.2);ctx.globalAlpha=1;
 // vignette
 const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.62)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function objectsHit(ang,cam){
 let best=100;
 const rx=Math.sin(ang),rz=Math.cos(ang);
 for(const o of objects){
  const dx=o.x-player.x,dz=o.z-player.z,dist=Math.hypot(dx,dz),rel=rayAngle(Math.atan2(dx,dz)-ang);
  if(Math.abs(rel)<Math.atan2(Math.max(o.w,o.d)/2,dist))best=Math.min(best,dist*Math.cos(cam));
 }
 return best;
}
function drawObjects(horizon,fov){
 const list=objects.map(o=>{const dx=o.x-player.x,dz=o.z-player.z,d=Math.hypot(dx,dz),a=rayAngle(Math.atan2(dx,dz)-player.a);return{...o,d,a}}).filter(o=>Math.abs(o.a)<fov*.62&&o.d>.3).sort((a,b)=>b.d-a.d);
 for(const o of list){
  const sx=W/2+(o.a/fov)*W, hh=Math.min(H*1.3,360/o.d), ww=Math.max(8,hh*(o.w/o.h)*.7), yy=horizon-hh*.55;
  ctx.fillStyle=o.c;ctx.fillRect(sx-ww/2,yy,ww,hh);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(sx-ww/2,yy,ww,Math.max(3,hh*.07));
 }
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;move(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
