<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zona 04 — Apocalyptic Room v17</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080907;color:#ddd;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#10130f}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,4,3,.92);cursor:pointer;z-index:5}
#panel{width:min(520px,90vw);padding:30px;border:1px solid #5b6254;background:#0b0d0b;box-shadow:0 20px 80px #000}
h1{margin:0 0 8px;letter-spacing:.08em}p{color:#aeb3a4}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border:1px solid #a7ad99;letter-spacing:.08em}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}.cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2px;border-radius:50%;background:#eee;box-shadow:0 0 7px #fff}
#info{position:absolute;left:20px;bottom:20px;padding:12px 15px;background:rgba(5,7,5,.7);border:1px solid #555;font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="cross"></div><div id="info">WASD mover · SHIFT correr · flechas girar · clic para capturar el mouse</div></div>
<div id="start" class="hidden"></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),start=document.getElementById('start');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const player={x:0,z:8.2,a:0,pitch:0,active:true};
const keys={};
const walls=[
{x1:-15,z1:-11,x2:15,z2:-11},{x1:15,z1:-11,x2:15,z2:11},
{x1:15,z1:11,x2:-15,z2:11},{x1:-15,z1:11,x2:-15,z2:-11},
{x1:8.45,z1:10.48,x2:8.45,z2:11},{x1:11.55,z1:11,x2:11.55,z2:10.48}
];
const objects=[
{x:-9,z:-6.8,w:4.8,d:1.0,h:3.8,c:'#30332f',name:'estantería'},
{x:7,z:-5.5,w:6,d:1.7,h:1.4,c:'#493a2d',name:'mesa de trabajo'},
{x:-1,z:-3.5,w:3.5,d:1.8,h:1.5,c:'#3f3429',name:'mesa'},
{x:3.3,z:-1.8,w:1.3,d:1.1,h:1.0,c:'#34362f',name:'silla caída'},
{x:-11,z:3,w:1.2,d:1.0,h:.8,c:'#57372a',name:'caja'},
{x:-9.6,z:4,w:1.0,d:1.0,h:.7,c:'#3b3329',name:'caja'},
{x:5,z:2,w:1.0,d:1.0,h:.7,c:'#4b3a2d',name:'escombro'},
{x:8,z:4,w:1.3,d:1.1,h:.9,c:'#3b3028',name:'escombro'}
];

function collide(x,z){
 const r=.38;
 if(x<-14.5||x>14.5||z<-10.5||z>10.5)return true;
 for(const o of objects)if(Math.abs(x-o.x)<o.w/2+r&&Math.abs(z-o.z)<o.d/2+r)return true;
 return false;
}
function startGame(){player.active=true;start.classList.add('hidden');canvas.focus();try{canvas.requestPointerLock()}catch(e){}}
start.addEventListener('click',startGame); canvas.addEventListener('click',()=>{if(player.active){try{canvas.requestPointerLock()}catch(e){}}});
document.addEventListener('pointerlockchange',()=>{});
addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(!player.active&&(e.code==='Enter'||e.code==='Space'))startGame()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('mousemove',e=>{if(!player.active)return;if(document.pointerLockElement===canvas){player.a-=e.movementX*.0025;player.pitch=Math.max(-.5,Math.min(.5,player.pitch-e.movementY*.0018))}});

function move(dt){
 if(!player.active)return;
 const speed=(keys.ShiftLeft||keys.ShiftRight)?6:3.5;
 let f=Number(keys.KeyW||keys.ArrowUp)-Number(keys.KeyS||keys.ArrowDown);
 let s=Number(keys.KeyD||keys.ArrowRight)-Number(keys.KeyA||keys.ArrowLeft);
 const n=Math.hypot(f,s)||1;f/=n;s/=n;
 const nx=player.x+(-Math.sin(player.a)*f+Math.cos(player.a)*s)*speed*dt;
 const nz=player.z+(-Math.cos(player.a)*f-Math.sin(player.a)*s)*speed*dt;
 if(!collide(nx,player.z))player.x=nx;if(!collide(player.x,nz))player.z=nz;
}
function rayAngle(a){while(a<-Math.PI)a+=Math.PI*2;while(a>Math.PI)a-=Math.PI*2;return a}
function wallDist(ang){
 const dx=Math.sin(ang), dz=-Math.cos(ang);
 let best=1000;
 if(Math.abs(dx)>1e-6){const tx=dx>0?(15-player.x)/dx:(-15-player.x)/dx;if(tx>0)best=Math.min(best,tx)}
 if(Math.abs(dz)>1e-6){const tz=dz>0?(11-player.z)/dz:(-11-player.z)/dz;if(tz>0)best=Math.min(best,tz)}
 return best;
}
function rayBox(o,ang){
 const dx=Math.sin(ang),dz=-Math.cos(ang);
 const minX=o.x-o.w/2,maxX=o.x+o.w/2,minZ=o.z-o.d/2,maxZ=o.z+o.d/2;
 let tx1=-Infinity,tx2=Infinity,tz1=-Infinity,tz2=Infinity;
 if(Math.abs(dx)<1e-8){if(player.x<minX||player.x>maxX)return 1000}else{tx1=(minX-player.x)/dx;tx2=(maxX-player.x)/dx}
 if(Math.abs(dz)<1e-8){if(player.z<minZ||player.z>maxZ)return 1000}else{tz1=(minZ-player.z)/dz;tz2=(maxZ-player.z)/dz}
 const near=Math.max(Math.min(tx1,tx2),Math.min(tz1,tz2));
 const far=Math.min(Math.max(tx1,tx2),Math.max(tz1,tz2));
 if(far<0||near>far)return 1000;
 return near>0?near:far;
}
function project(x,z,y=0){
 const dx=x-player.x,dz=z-player.z;
 const ca=Math.cos(player.a),sa=Math.sin(player.a);
 const cx=dx*ca+dz*sa;
 const cz=dx*sa-dz*ca;
 if(cz<=.15)return null;
 const fov=Math.PI/3;
 const focal=(H/2)/Math.tan(fov/2);
 return {x:W/2+(cx/cz)*focal,y:H/2+player.pitch*H*.4-(y/cz)*focal,z:cz};
}
function quad(points,fill,stroke){
 const p=points.map(v=>project(v[0],v[1],v[2]));
 if(p.some(v=>!v))return;
 ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
 for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}
function render(){
 ctx.clearRect(0,0,W,H);
 const horizon=H/2+player.pitch*H*.4;

 // Ceiling and floor background
 ctx.fillStyle='#0b0d0b';ctx.fillRect(0,0,W,horizon);
 const floor=ctx.createLinearGradient(0,horizon,0,H);
 floor.addColorStop(0,'#55574f');floor.addColorStop(1,'#181a16');
 ctx.fillStyle=floor;ctx.fillRect(0,horizon,W,H-horizon);

 // Perspective floor tiles make the room orientation obvious.
 for(let z=-10;z<=10;z+=2){
   quad([[-14,z,0],[14,z,0],[14,z+.035,0],[-14,z+.035,0]],'rgba(190,190,175,.10)');
 }
 for(let x=-14;x<=14;x+=2){
   quad([[x,-10,0],[x+.035,-10,0],[x+.035,10,0],[x,10,0]],'rgba(190,190,175,.08)');
 }

 // Four actual room walls, with visible top edges.
 const wallDefs=[
  [[-15,-11],[15,-11],'#55594f'],
  [[15,-11],[15,11],'#464a43'],
  [[15,11],[-15,11],'#3f433c'],
  [[-15,11],[-15,-11],'#4b4f47']
 ];
 for(const w of wallDefs){
   quad([[w[0][0],w[0][1],0],[w[1][0],w[1][1],0],[w[1][0],w[1][1],7],[w[0][0],w[0][1],7]],w[2],'#181a17');
 }

 // Door on the far wall
 quad([[8.3,-10.95,0],[11.7,-10.95,0],[11.7,-10.95,6.2],[8.3,-10.95,6.2]],'#242721','#0b0c0b');
 quad([[8.55,-11.02,.25],[11.45,-11.02,.25],[11.45,-11.02,5.9],[8.55,-11.02,5.9]],'#11130f','#777c70');

 // Windows: obvious illuminated openings.
 quad([[-7.5,-11.03,2.0],[-3.0,-11.03,2.0],[-3.0,-11.03,5.2],[-7.5,-11.03,5.2]],'#687866','#b3bea9');
 quad([[1.5,-11.03,2.0],[5.5,-11.03,2.0],[5.5,-11.03,5.2],[1.5,-11.03,5.2]],'#687866','#b3bea9');

 // Objects: draw large, unmistakable 3D boxes.
 const visible=objects.map(o=>({...o,dist:Math.hypot(o.x-player.x,o.z-player.z)}))
   .filter(o=>o.dist<28).sort((a,b)=>b.dist-a.dist);
 for(const o of visible){
   const x1=o.x-o.w/2,x2=o.x+o.w/2,z1=o.z-o.d/2,z2=o.z+o.d/2;
   // Front, side and top faces
   quad([[x1,z1,0],[x2,z1,0],[x2,z1,o.h],[x1,z1,o.h]],o.c,'#050505');
   quad([[x2,z1,0],[x2,z2,0],[x2,z2,o.h],[x2,z1,o.h]],'#5b5142','#050505');
   quad([[x1,z1,o.h],[x2,z1,o.h],[x2,z2,o.h],[x1,z2,o.h]],'#746957','#111');
   // Bright marker on object center so every object is unmistakable.
   const p=project(o.x,o.z,o.h+.15);
   if(p){
     ctx.fillStyle='#c6b98f';
     ctx.font='bold 12px system-ui';
     ctx.textAlign='center';
     ctx.fillText(o.name.toUpperCase(),p.x,p.y-6);
   }
 }
 
 // Large foreground test crate: confirms object projection is working.
 const test=project(0,3.0,1.4);
 if(test){
   const d=Math.max(.5,test.z);
   const ww=Math.min(W*.18,3.2*((H/2)/Math.tan(Math.PI/6))/d);
   const hh=Math.min(H*.32,1.8*((H/2)/Math.tan(Math.PI/6))/d);
   ctx.fillStyle='#80603c';ctx.fillRect(test.x-ww/2,test.y-hh,ww,hh);
   ctx.strokeStyle='#e0c18b';ctx.lineWidth=3;ctx.strokeRect(test.x-ww/2,test.y-hh,ww,hh);
   ctx.fillStyle='#e0c18b';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('OBJETO TEST',test.x,test.y-hh-8);
 }
 // Ceiling beams
 for(let x=-12;x<=12;x+=6){
   quad([[x,-10.7,6.8],[x+.28,-10.7,6.8],[x+.28,10.7,6.8],[x,10.7,6.8]],'#292c27','#11120f');
 }
 // Hanging light
 const lamp=project(0,-1.5,6.7);
 if(lamp){
   ctx.fillStyle='#d9ddbd';ctx.beginPath();ctx.arc(lamp.x,lamp.y,Math.max(5,Math.min(14,70/lamp.z)),0,Math.PI*2);ctx.fill();
 }

 // Vignette
 const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.8);
 g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.28)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;move(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
